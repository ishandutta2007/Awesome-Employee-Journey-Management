<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      .pulse-node {
        animation: pulseScale 3s ease-in-out infinite;
      }
      .pill-float {
        animation: pillHover 6s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -40px) scale(1.2); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes pulseScale {
        0%, 100% { r: 6px; opacity: 0.6; }
        50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes pillHover {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmospheric Orbs (Behind content) -->
  <g opacity="0.35">
    <circle class="orb-1" cx="200" cy="100" r="140" fill="#3b82f6" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle class="orb-1" cx="600" cy="380" r="110" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Journey Path (Behind text) -->
  <g opacity="0.45">
    <path class="wave-line" d="M -50 210 Q 300 90, 600 210 T 1250 210" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="wave-line" d="M -50 250 Q 300 370, 600 250 T 1250 250" fill="none" stroke="#c084fc" stroke-width="2" />
    
    <!-- Lifecycle Checkpoints -->
    <circle class="pulse-node" cx="180" cy="168" fill="#38bdf8" />
    <circle class="pulse-node" cx="420" cy="180" fill="#818cf8" />
    <circle class="pulse-node" cx="600" cy="210" fill="#c084fc" />
    <circle class="pulse-node" cx="780" cy="240" fill="#e879f9" />
    <circle class="pulse-node" cx="1020" cy="215" fill="#f472b6" />
  </g>

  <!-- Central Header Text (Foreground - High Contrast & Crisp) -->
  <g text-anchor="middle">
    <!-- Top Category Badge / Kicker -->
    <rect x="470" y="42" width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="600" y="61" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      CURATED ECOSYSTEM &amp; FRAMEWORKS
    </text>

    <!-- Main Title -->
    <text x="600" y="132" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Employee Journey Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="174" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      The complete landscape for Employee Experience (EX), Lifecycle Workflows &amp; People Ops
    </text>
  </g>

  <!-- Lifecycle Stage Feature Pills (Floating dynamically at bottom) -->
  <g class="pill-float" transform="translate(0, 0)">
    <!-- Pill 1: Hire -->
    <g transform="translate(110, 310)">
      <rect width="170" height="48" rx="24" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="26" cy="24" r="10" fill="#0369a1" />
      <text x="26" y="28" fill="#e0f2fe" font-size="12" font-family="sans-serif" text-anchor="middle">🚀</text>
      <text x="96" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Onboarding</text>
    </g>

    <!-- Pill 2: Engage -->
    <g transform="translate(310, 310)">
      <rect width="170" height="48" rx="24" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="26" cy="24" r="10" fill="#4338ca" />
      <text x="26" y="28" fill="#e0e7ff" font-size="12" font-family="sans-serif" text-anchor="middle">💬</text>
      <text x="96" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Engagement</text>
    </g>

    <!-- Pill 3: Grow -->
    <g transform="translate(510, 310)">
      <rect width="180" height="48" rx="24" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="26" cy="24" r="10" fill="#7e22ce" />
      <text x="26" y="28" fill="#faf5ff" font-size="12" font-family="sans-serif" text-anchor="middle">📈</text>
      <text x="100" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Performance</text>
    </g>

    <!-- Pill 4: Listen -->
    <g transform="translate(720, 310)">
      <rect width="170" height="48" rx="24" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1.2" />
      <circle cx="26" cy="24" r="10" fill="#be185d" />
      <text x="26" y="28" fill="#fdf2f8" font-size="12" font-family="sans-serif" text-anchor="middle">🎯</text>
      <text x="96" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Voice &amp; Pulse</text>
    </g>

    <!-- Pill 5: Offboarding -->
    <g transform="translate(920, 310)">
      <rect width="170" height="48" rx="24" fill="url(#pillGrad)" stroke="#fb7185" stroke-width="1.2" />
      <circle cx="26" cy="24" r="10" fill="#9f1239" />
      <text x="26" y="28" fill="#fff1f2" font-size="12" font-family="sans-serif" text-anchor="middle">🌱</text>
      <text x="96" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Offboarding</text>
    </g>
  </g>
</svg>
